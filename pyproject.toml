# Not an installable package: the scan runs as `python -m spectus` from a checkout of `main`, next to the schemas it
# validates against. The dependency groups install what each job needs, e.g. `pip install --group test`.
[dependency-groups]
scan = ["jsonschema>=4.23"]
test = [{include-group = "scan"}, "pytest>=8", "pytest-cov>=6"]
# Pinned, since the JSON Schema exports under schemas/ are checked against what this exact version generates
schemas = ["linkml==1.12.1"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.yml
  |\.txt
  |\.sh
  |\.git
  |\.ini
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring style: prefer the D213 / D211 conventions
    "D203",
    "D212",
    # Constructors are described by their class docstring
    "D107",
    # Scripts deliberately use `print` instead of logging
    "T201",
    # Common HTTP status codes (200, 403, ...) and other small integer
    # literals are clearer inline than as named module-level constants
    "PLR2004",
    # Long, descriptive messages constructed at the raise site are preferred
    # over per-call-site exception subclasses for one-off internal errors
    "TRY003",
    # Fine to use Unicode characters
    "RUF003",
    # `scripts/` is deliberately not a Python package
    "INP001",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/python/**" = [
    # Tests assert, and need neither docstrings nor annotations to read well
    "S101",
    "D",
    "ANN",
    # Tests poke at internals and build fake responses from literal values, fake tokens included
    "SLF001",
    "PLR2004",
    "ARG",
    "S106",
]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "spectus"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["spectus"]
