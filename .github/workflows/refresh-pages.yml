name: Refresh pages

# Builds the site with the records of the `data` branch bundled into it, and
# publishes it to `gh-pages`: on every push to `main`, and after every scan that
# appended records (see scan-workflow-runs.yml).

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A deploy waits for the one before it rather than racing it to `gh-pages`;
    # set on the job, since a workflow-level group is not applied when this
    # workflow is called by another.
    concurrency:
      group: refresh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The records the site is drawn from; the first scan creates the branch
      - name: Checkout data
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          persist-credentials: false

      - name: Build site
        run: npm run build

      # Leaves `pr-preview/` alone, which holds the open pull requests'
      # previews, and rebases rather than force-pushes so that a preview
      # deployed meanwhile is not lost.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
