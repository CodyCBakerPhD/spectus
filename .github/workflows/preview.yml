name: Preview

# Builds the preview with a read-only token, so it is safe to run on pull
# requests from forks. The build is handed to `preview-deploy.yml` as an
# artifact, and that workflow — which runs from `main` with write access —
# publishes it to `gh-pages`.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # The records the site is drawn from; the first scan creates the branch
      - name: Checkout data
        if: github.event.action != 'closed'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          persist-credentials: false

      - name: Build site
        if: github.event.action != 'closed'
        run: npm run build

      - name: Upload site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: dist/
          include-hidden-files: true
          retention-days: 1

      - name: Record pull request
        env:
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_ACTION: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
        run: |
          mkdir -p preview-meta
          echo "$PR_NUMBER" > preview-meta/pr-number
          echo "$PREVIEW_ACTION" > preview-meta/action

      - name: Upload pull request record
        uses: actions/upload-artifact@v7
        with:
          name: preview-meta
          path: preview-meta/
          retention-days: 1
