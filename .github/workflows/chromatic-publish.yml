name: Chromatic publish

# Uploads the builds made by `chromatic.yml` and `chromatic-playwright.yml` to
# Chromatic. A pull request from a fork gets no secrets, so those workflows
# cannot upload for it themselves; `workflow_run` always runs this file as it
# is on `main`, with the project tokens.
#
# Nothing from the pushed commit is executed here. The Chromatic CLI is
# installed from `main`, and the commit is checked out only so that the CLI
# can read its git history, which is how Chromatic picks the baselines to
# compare the build against.

on:
  workflow_run:
    workflows:
      - Chromatic (Storybook)
      - Chromatic (Playwright)
    types:
      - completed

jobs:
  publish:
    name: Publish to Chromatic
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install the Chromatic CLI
        working-directory: main
        run: npm ci --ignore-scripts

      # By hash, since a fork's commit is on none of this repository's
      # branches.
      - name: Checkout the built commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          git init --quiet commit
          cd commit
          git remote add origin "$SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*' "$HEAD_SHA"
          git checkout --quiet --detach "$HEAD_SHA"

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: chromatic-build
          path: ${{ runner.temp }}/storybook-static
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish to Chromatic
        working-directory: commit
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ github.event.workflow_run.name == 'Chromatic (Playwright)' && secrets.CHROMATIC_PLAYWRIGHT_PROJECT_TOKEN || secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          # What the Chromatic action reports for a pull request; set
          # by hand since this runs on `workflow_run`, not on the push
          # or pull request itself.
          CHROMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          CHROMATIC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHROMATIC_SLUG: ${{ github.event.workflow_run.head_repository.full_name }}
          # Only a push to this repository's own `main` is accepted as
          # the new baseline; a fork's branch may be named `main` too.
          AUTO_ACCEPT: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
        run: |
          # A repository without a project token (a fork running these workflows
          # on its own pushes, or one not yet set up with Chromatic) has
          # nothing to publish with.
          if [[ -z "$CHROMATIC_PROJECT_TOKEN" ]]; then
            echo "::notice::No Chromatic project token is set; skipping the upload."
            exit 0
          fi
          # An explicit, empty config file, so that a
          # `chromatic.config.json` in the commit is not read.
          echo '{}' > "$RUNNER_TEMP/chromatic.config.json"
          args=(
            --storybook-build-dir "$RUNNER_TEMP/storybook-static"
            --config-file "$RUNNER_TEMP/chromatic.config.json"
            --exit-zero-on-changes
          )
          if [[ "$AUTO_ACCEPT" == true ]]; then
            args+=(--auto-accept-changes)
          fi
          "$GITHUB_WORKSPACE/main/node_modules/.bin/chromatic" "${args[@]}"
