name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in public repositories after 60 days without repository activity.
# This re-enables workflows in every repository the keepalive GitHub App is installed on, which resets that timer.
# Install the App on this repository too, so this workflow keeps itself alive.

on:
  schedule:
    - cron: '0 12 * * 1'  # 7 am EST every Monday
  workflow_dispatch:
    inputs:
      dry:
        description: 'List the workflows that would be enabled without changing anything'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  Keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install "pyjwt[crypto]"
      - name: Re-enable scheduled workflows
        env:
          APP_ID: ${{ secrets.KEEPALIVE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
        run: python scripts/keepalive_scheduled_workflows.py ${{ inputs.dry && '--dry' || '' }}
