name: Scan workflow runs

# Appends the finished GitHub Actions workflow runs of every repository named by `config.json` on the `config` branch
# to the JSON Lines files of the `data` branch, then redeploys the site so it shows them.
# How a scan avoids spending rate limit on repositories that did not change is described in docs/workflow_runs/README.md.

on:
  schedule:
    - cron: '23 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      force:
        description: 'List the newest runs of every repository, even those whose newest run looks unchanged'
        type: boolean
        default: false
      backfill-days:
        description: 'How far back to look on the first scan of a repository'
        type: number
        default: 90

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      appended: ${{ steps.scan.outputs.appended }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main
          persist-credentials: false

      - name: Checkout config
        uses: actions/checkout@v7
        with:
          ref: config
          path: config
          persist-credentials: false

      - name: Checkout data
        id: checkout-data
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      # The first scan starts the branch, with no history shared with any other
      - name: Start the data branch
        if: steps.checkout-data.outcome == 'failure'
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf data
          git init --quiet --initial-branch=data data
          git -C data remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Restore the scan cache
        uses: actions/cache/restore@v6
        with:
          path: .spectus-cache
          key: spectus-scan-${{ github.run_id }}
          restore-keys: spectus-scan-

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group scan

      - name: Scan
        id: scan
        working-directory: main
        env:
          # A token of your own (see docs/workflow_runs/README.md) raises the GraphQL rate limit from 1,000 points an hour
          GITHUB_TOKEN: ${{ secrets.SPECTUS_TOKEN || github.token }}
          BACKFILL_DAYS: ${{ inputs.backfill-days || 90 }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: >
          python -m spectus scan
          --config ../config/config.json
          --data-dir ../data
          --cache-dir ../.spectus-cache
          --backfill-days "$BACKFILL_DAYS"
          --time-budget-minutes 40
          $FORCE

      # Also after a scan that failed partway, since what it finished is consistent with the cache it saved
      - name: Commit and push the new records
        id: push
        if: always() && hashFiles('data/data/**') != ''
        working-directory: data
        env:
          APPENDED: ${{ steps.scan.outputs.appended }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new records"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Appended ${APPENDED:-new} workflow run records"
          git push origin HEAD:data

      # Only once the records it describes are pushed, or a later scan would skip what was never saved
      - name: Save the scan cache
        if: always() && steps.push.outcome != 'failure' && steps.push.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .spectus-cache
          key: spectus-scan-${{ github.run_id }}

  deploy:
    name: Deploy
    needs: [scan]
    if: needs.scan.outputs.appended != '' && needs.scan.outputs.appended != '0'
    uses: ./.github/workflows/refresh-pages.yml
    permissions:
      contents: write
