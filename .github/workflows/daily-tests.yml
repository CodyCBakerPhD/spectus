name: Daily tests

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read

  python-tests:
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    permissions:
      contents: read

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [tests, python-tests]
    if: failure()
    permissions: {}
    steps:
      - uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: `spectus` Daily tests"
          to: cody.c.baker.phd@gmail.com
          from: spectus
          body: |
            The daily test run for the spectus repository has failed.

            Tests: ${{ needs.tests.result }}
            Python tests: ${{ needs.python-tests.result }}

            Please review the workflow run at ${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily-tests.yml
